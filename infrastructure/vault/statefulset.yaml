apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: vault
spec:
  serviceName: vault
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      serviceAccountName: vault
      containers:
      - name: vault
        image: hashicorp/vault:1.15.0
        imagePullPolicy: IfNotPresent
        args:
          - server
        ports:
        - name: http
          containerPort: 8200
          protocol: TCP
        env:
        - name: VAULT_ADDR
          value: "http://0.0.0.0:8200"
        volumeMounts:
        - name: config
          mountPath: /vault/config
          readOnly: true
        - name: data
          mountPath: /vault/data
        - name: logs
          mountPath: /vault/logs
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /v1/sys/health
            port: 8200
          initialDelaySeconds: 10
          periodSeconds: 10
          # Vault devuelve código 503 cuando no está inicializado, pero eso es OK
          # Aceptamos códigos 200 (inicializado y desbloqueado) y 429 (standby)
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /v1/sys/health
            port: 8200
          initialDelaySeconds: 60
          periodSeconds: 30
          # No matar el pod si Vault no está inicializado todavía
          failureThreshold: 5
      volumes:
      - name: config
        configMap:
          name: vault-config
      - name: logs
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
